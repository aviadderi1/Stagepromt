name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk StagePromt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StagePromt.apk
          path: StagePromt.apk
          retention-days: 1

      - name: Delete previous releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for t in $(gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName'); do
            gh release delete "$t" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: StagePromt – גרסה ${{ github.run_number }}
          files: StagePromt.apk
