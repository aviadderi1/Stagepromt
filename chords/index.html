<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0C0E">
<title>StagePromt · עורך אקורדים</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0C0E;--p1:#121418;--p2:#17191D;--ln:#22252B;--ln2:#2C2F35;--tx:#F4EFE6;--mu:#8F897F;--am:#E8A23A;--amS:#2A2419;--ch:#FFB547;--v:#F6D9A8;--c:#A9D3FF;--b:#D9C2FF}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Assistant',sans-serif}
button{font-family:inherit;cursor:pointer}
body{display:grid;grid-template-columns:320px 1fr;grid-template-rows:64px 1fr;height:100vh;overflow:hidden}
body.src{grid-template-columns:320px 1fr 460px}
.top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 22px;border-bottom:1px solid var(--ln);background:#0E0F12}
.logo{font-family:'Rubik';font-weight:700;font-size:20px;letter-spacing:1px}.logo em{font-style:normal;color:var(--am)}
.top .sub{color:var(--mu);font-weight:600}
.flex1{flex:1}
.user{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:14px}
.user i{width:32px;height:32px;border-radius:50%;background:#23252B;display:inline-flex;align-items:center;justify-content:center;font-style:normal;color:var(--tx);font-weight:700}
.save{font-size:14px;color:#7FD38B;display:flex;align-items:center;gap:6px}.save.busy{color:var(--mu)}
/* sidebar */
aside{border-left:1px solid var(--ln);display:flex;flex-direction:column;min-height:0;background:#0E0F12}
.search{margin:16px 16px 10px;position:relative}
.search input{width:100%;height:42px;border-radius:12px;border:1px solid var(--ln2);background:var(--p1);color:var(--tx);font:16px 'Assistant';padding:0 40px 0 12px;outline:none}
.search svg{position:absolute;right:12px;top:11px;color:var(--mu)}
.mode{display:flex;gap:4px;margin:16px 16px 0;padding:4px;background:var(--p1);border:1px solid var(--ln2);border-radius:12px}.mode button{flex:1;height:36px;border:0;border-radius:9px;background:transparent;color:var(--mu);font-weight:800;font-size:15px}.mode button.on{background:var(--am);color:#1A1205}
.tabs{display:flex;gap:4px;margin:0 16px 10px}
.tabs button{flex:1;height:34px;border:0;border-radius:9px;background:transparent;color:var(--mu);font-weight:700;font-size:14px}
.tabs button.on{background:var(--p2);color:var(--tx)}
.list{flex:1;overflow:auto;padding:4px 10px 20px}
.it{display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px;border:0;background:transparent;border-radius:12px;color:var(--tx);text-align:right}
.it:hover{background:var(--p1)}.it.on{background:var(--amS);box-shadow:inset 0 0 0 1px #6B5122}
.it .av{width:38px;height:38px;border-radius:50%;background:#23252B;display:flex;align-items:center;justify-content:center;font-family:'Rubik';font-weight:600;color:#CFC9BF;flex:none}
.it .tt{flex:1;min-width:0}.it b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it small{display:block;color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:20px;background:#1E2a1F;color:#7FD38B;flex:none}.badge.no{background:#2a1E1E;color:#E0675C}
/* main */
main{display:flex;flex-direction:column;min-height:0;min-width:0}
.sh{display:flex;align-items:center;gap:16px;padding:18px 34px 14px;border-bottom:1px solid var(--ln)}
.sh h1{margin:0;font-family:'Rubik';font-weight:600;font-size:28px}
.sh .art{color:var(--mu);font-size:16px}
.key{display:flex;align-items:center;gap:8px;color:var(--mu);font-weight:600}
.key select{height:38px;border-radius:10px;border:1px solid var(--ln2);background:var(--p1);color:var(--tx);font:700 16px 'Rubik';padding:0 10px;direction:ltr}
.btn{height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--ln2);background:var(--p1);color:var(--tx);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:#3A3E46}
.scroll{flex:1;overflow:auto;padding:22px 34px 140px}
.part{background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:16px 22px 18px;margin:0 auto 16px;max-width:980px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.chip{font-size:13px;font-weight:800;padding:4px 12px;border-radius:8px;color:#1A1205}
.chip.verse{background:var(--am)}.chip.chorus{background:#7FB8F5}.chip.bridge{background:#B9A2EE}
.ph .cnt{color:var(--mu);font-size:13px}
.ph .btn{height:30px;font-size:13px;padding:0 10px}
.ln{font-size:26px;font-weight:700;line-height:1;padding-top:30px;margin-bottom:10px;white-space:pre-wrap;word-break:keep-all}
.ln.verse{color:var(--v)}.ln.chorus{color:var(--c)}.ln.bridge{color:var(--b)}
.g{position:relative;display:inline;border-radius:3px;cursor:pointer}
.g:hover{background:rgba(255,255,255,.08)}
.g.sel{background:rgba(232,162,58,.28);box-shadow:0 2px 0 var(--am)}
.cd{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-4px);font:700 17px 'Rubik';color:var(--ch);white-space:nowrap;direction:ltr;padding:1px 4px;border-radius:5px}
.g:hover .cd{background:#2A2419}
.ref{color:var(--mu);font-size:14px;padding:14px 22px;border:1px dashed var(--ln2);border-radius:14px;max-width:980px;margin:0 auto 16px}
/* palette */
.pal{position:fixed;left:0;right:320px;}
body.src .pal{left:460px}
.pal{bottom:0;padding:14px 34px 16px;background:linear-gradient(rgba(11,12,14,0),#0B0C0E 28%);display:flex;justify-content:center}
.palIn{display:flex;align-items:center;gap:8px;background:#15171B;border:1px solid var(--ln2);border-radius:16px;padding:10px 12px;box-shadow:0 12px 40px rgba(0,0,0,.55);max-width:980px;width:100%;flex-wrap:wrap}
.palIn .lb{color:var(--mu);font-size:13px;font-weight:700;margin-inline-end:4px}
.cb{height:40px;min-width:52px;padding:0 10px;border-radius:10px;border:1px solid var(--ln2);background:var(--p2);color:var(--tx);font:700 17px 'Rubik';direction:ltr}
.cb:hover{border-color:var(--am);color:var(--ch)}
.cb.rec{background:#1E1B15}
.sep{width:1px;height:28px;background:var(--ln2);margin:0 4px}
.cin{height:40px;width:110px;border-radius:10px;border:1px solid var(--am);background:#0E0F12;color:var(--ch);font:700 18px 'Rubik';direction:ltr;text-align:center;outline:none}
.del{color:#E0675C}
.keys{color:#6E695F;font-size:12.5px;text-align:center;margin:0 auto 8px;background:#0B0C0E;padding:4px 12px;border-radius:8px;width:max-content;max-width:100%}
.keys kbd{background:#1A1C20;border:1px solid var(--ln2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font:600 12px 'Rubik';color:#BDB6AA}
.srcP{border-right:1px solid var(--ln);background:#0E0F12;display:flex;flex-direction:column;min-height:0}
.srcH{padding:14px 18px;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:10px;font-weight:700}.srcH a{color:var(--am);font-size:13px;text-decoration:none;direction:ltr}
.srcB{flex:1;overflow:auto;padding:16px 20px;background:#fff;color:#111}
.srcB .row{direction:rtl;text-align:right;white-space:pre;font:15px/1.5 Arial,sans-serif}.srcB .row.c{color:#C2410C;font-weight:700}
.draft{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 auto 16px;max-width:980px;padding:12px 16px;border-radius:14px;background:#122233;border:1px solid #2F5C86;color:#CFE6FF;font-weight:600}
.draft .btn.ok{background:#2F7DD1;border-color:#2F7DD1;color:#fff}
.cd.dr{color:#7CC4FF;outline:1px dashed #3F7FB6;outline-offset:1px}
.find{margin:0 auto 16px;max-width:980px;padding:12px 16px;border-radius:14px;border:1px dashed var(--ln2);color:var(--mu);display:flex;align-items:center;gap:10px}
.spin{width:18px;height:18px;border:3px solid #34373D;border-top-color:var(--am);border-radius:50%;display:inline-block;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.done{font-size:12px;color:#7FD38B;display:block;margin-top:2px}
.empty{color:var(--mu);text-align:center;margin-top:18vh;font-size:18px}
.login{grid-column:1/-1;display:flex;align-items:center;justify-content:center}
.login .card{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:420px}
.gbtn{height:54px;width:320px;border-radius:14px;border:0;background:#fff;color:#1F1F1F;font:700 17px 'Assistant';display:flex;align-items:center;justify-content:center;gap:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top"><div class="logo">STAGE<em>PROMT</em></div><span class="sub">עורך אקורדים</span><span class="flex1"></span><span class="save" id="save"></span><span class="user" id="user"></span></div>
<section class="login" id="login" hidden><div class="card"><h2 style="margin:0;font-size:26px">עורך האקורדים של StagePromt</h2><p style="color:var(--mu);margin:0;font-size:17px">התחבר עם אותו חשבון שמחובר באפליקציה. כל אקורד שתוסיף כאן יופיע בטאבלט ובנייד.</p>
 <button class="gbtn" id="ggo"><svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>התחבר עם Google</button>
 <div id="lerr" style="color:#E0675C;min-height:20px"></div></div></section>
<aside id="side" hidden>
 <div class="mode" id="mode" hidden><button data-m="mine" class="on">השירים שלי</button><button data-m="lib">המאגר</button></div>
 <div class="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="חיפוש שיר או אמן…"></div>
 <div class="tabs"><button data-f="all" class="on">הכול</button><button data-f="no">בלי אקורדים</button><button data-f="yes">עם אקורדים</button><button data-f="done">טופלו</button></div>
 <div class="list" id="list"></div>
</aside>
<main id="main" hidden>
 <div class="sh" id="sh"></div>
 <div class="scroll" id="sc"></div>
 <div class="pal" id="pal" hidden><div style="width:100%;max-width:980px"><div class="keys"><kbd>←</kbd> <kbd>→</kbd> מילה הבאה/קודמת · <kbd>Shift</kbd>+חץ אות אחת · <kbd>↑</kbd> <kbd>↓</kbd> שורה · הקלדה = אקורד · <kbd>Enter</kbd> שמירה · <kbd>Del</kbd> מחיקה · <kbd>Ctrl</kbd>+<kbd>Z</kbd> ביטול</div><div class="palIn" id="palIn"></div></div></div>
</main>
<section class="srcP" id="srcP" hidden><div class="srcH"><span>המקור</span><span class="flex1"></span><a id="srcA" target="_blank" rel="noopener"></a></div><div class="srcB" id="srcB"></div></section>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clusters=t=>String(t||'').match(/\P{M}\p{M}*|\p{M}+/gu)||[];
const FB={key:'AIzaSyAQj76Gha9yGidawfxbouvrE47teuzIsO4',project:'stagepromt',LS:'sp-chords-fb'};
FB.base='https://firestore.googleapis.com/v1/projects/'+FB.project+'/databases/(default)/documents';
const TN={verse:'בית',chorus:'פזמון',bridge:'גשר',note:'הערה'};
const KEYS=['C','Cm','C#','C#m','Db','D','Dm','D#m','Eb','Ebm','E','Em','F','Fm','F#','F#m','Gb','G','Gm','G#m','Ab','Abm','A','Am','A#m','Bb','Bbm','B','Bm'];
const NOTES=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'],NI={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
const CHORD_RX=/^[A-G](?:#|b)?(?:maj|min|dim|aug|sus|add|m|M|\+)?\d*(?:(?:sus|add|maj|b|#|\+|-)\d+)*(?:\/[A-G](?:#|b)?)?$/;
const OWNER='aviadderi1@gmail.com';
const CHORD_TOK=/^[A-H](?:#|b|♯|♭)?(?:maj|min|dim|aug|sus|add|m|M|°|ø|\+)?\d*(?:(?:sus|add|maj|b|#|\+|-)\d+)*(?:\/[A-H](?:#|b|♯|♭)?)?$/;
function isChordLine(l){const t=String(l||'').replace(/\u00a0/g,' ').trim();if(!t)return false;let n=0;for(const k of t.split(/\s+/)){if(CHORD_TOK.test(k))n++;else if(!/^(\||-|\(?x\d\)?|\d+x|\(|\)|\/|\.+|N\.C\.?)$/i.test(k))return false}return n>0}
const stripNik=t=>String(t||'').replace(/[\u0591-\u05C7]/g,'');
const normW=t=>stripNik(t).replace(/[^\p{L}\p{N} ]+/gu,' ').replace(/\s+/g,' ').trim();
const ST={mode:'mine',mine:[],lib:[],songs:[],cur:null,f:'all',q:'',sel:null,hist:[],recent:[],demo:false,saving:0};

/* ---------- auth + firestore ---------- */
function auth(){try{return JSON.parse(localStorage.getItem(FB.LS))||null}catch(e){return null}}
async function req(method,url,body,h){const r=await fetch(url,{method,headers:Object.assign({'Content-Type':'application/json'},h||{}),body:body?JSON.stringify(body):undefined});const t=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+' '+t.slice(0,200));return t?JSON.parse(t):{}}
async function token(){const st=auth();if(!st)throw new Error('signin');if(st.token&&st.exp>Date.now())return st;
 const j=await req('POST','https://securetoken.googleapis.com/v1/token?key='+FB.key,{grant_type:'refresh_token',refresh_token:st.refresh});
 Object.assign(st,{token:j.id_token,refresh:j.refresh_token,exp:Date.now()+(+j.expires_in||3600)*1000-60000});localStorage.setItem(FB.LS,JSON.stringify(st));return st}
function val(v){if(!v)return null;if('stringValue'in v)return v.stringValue;if('integerValue'in v)return +v.integerValue;if('doubleValue'in v)return v.doubleValue;return null}
async function loadSongs(){const st=await token();const out=[];let pt='';
 do{const j=await req('GET',FB.base+'/users/'+st.uid+'/appSongs?pageSize=300'+(pt?'&pageToken='+encodeURIComponent(pt):''),null,{Authorization:'Bearer '+st.token});
  for(const d of j.documents||[]){try{const s=JSON.parse(val(d.fields.j));if(s&&s.kind!=='pdf'&&s.parts&&s.parts.length)out.push(s)}catch(e){}}
  pt=j.nextPageToken||''}while(pt);
 return out.sort((a,b)=>String(a.title).localeCompare(String(b.title),'he'))}
const REF=/^[\[(]?\s*(פזמון|פיזמון)\s*[\])]?\s*$/;
function blocks(text){return String(text||'').split(/\n\s*\n/).map(b=>b.split('\n').map(x=>x.trim()).filter(Boolean)).filter(b=>b.length).map(b=>{
  if(b.length===1&&REF.test(b[0])&&!/[:：]/.test(b[0]))return{ref:true,lines:[]};
  const ch=/^(פזמון|פיזמון)\s*[:：]$/.test(b[0]);return{chorus:ch,lines:ch?b.slice(1):b}}).filter(b=>b.ref||b.lines.length)}
function libSong(d){const parts=[];let ch=null,n=0;
 for(const b of blocks(d.text)){if(b.ref){if(ch)parts.push({id:'r'+(n++),type:'chorus',text:'',ref:ch});continue}
  const p={id:'b'+(n++),type:b.chorus?'chorus':'verse',text:b.lines.join('\n'),chords:[]};if(b.chorus&&!ch)ch=p.id;parts.push(p)}
 let cs=[];try{cs=JSON.parse(d.chords||'[]')}catch(e){}
 const occ={};parts.forEach(p=>{if(p.ref)return;p.text.split('\n').forEach((l,li)=>{const k=occ[l]=(occ[l]||0);occ[l]++;
  let m=cs.filter(c=>c.t===l&&c.k===k);if(!m.length)m=cs.filter(c=>c.t===l&&c.k===0);m.forEach(c=>p.chords.push({l:li,i:c.i,n:1,c:c.c,t:l}))})});
 return {id:d.id,lib:true,chordsAt:d.chordsAt||0,title:d.title||'',artist:d.artist||'',key:d.key||'',kind:'text',parts}}
function libChordsOf(s){const out=[],occ={};s.parts.forEach(p=>{if(p.ref)return;const ls=p.text.split('\n');const cm={};(p.chords||[]).forEach(c=>{(cm[c.l]=cm[c.l]||[]).push(c)});
 ls.forEach((l,li)=>{const k=occ[l]=(occ[l]||0);occ[l]++;(cm[li]||[]).forEach(c=>out.push({t:l,k,i:c.i,c:c.c}))})});return out}
async function loadLib(){const out=[];let pt='';
 do{const j=await req('GET',FB.base+'/library?pageSize=300&key='+FB.key+(pt?'&pageToken='+encodeURIComponent(pt):''));
  for(const d of j.documents||[]){const o={id:d.name.split('/').pop()};for(const[k,x]of Object.entries(d.fields||{}))o[k]=val(x);if(o.text)out.push(libSong(o))}
  pt=j.nextPageToken||''}while(pt);
 return out.sort((a,b)=>String(a.title).localeCompare(String(b.title),'he'))}
async function setMode(m){ST.mode=m;$$('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));ST.cur=null;ST.sel=null;
 if(m==='lib'&&!ST.lib.length&&!ST.demo){$('#list').innerHTML='<div class="empty" style="font-size:15px;margin-top:40px">טוען את המאגר…</div>';try{ST.lib=await loadLib()}catch(e){$('#list').innerHTML='<div class="empty" style="font-size:15px">לא הצלחתי לטעון את המאגר</div>';return}}
 ST.songs=m==='lib'?ST.lib:ST.mine;renderList();renderSong()}
let saveT=0;function saveSoon(){if(ST.cur&&ST.cur.lib&&hasDraft(ST.cur)){setSave('draft');return}clearTimeout(saveT);setSave('busy');saveT=setTimeout(saveNow,700)}
async function saveNow(){const s=ST.cur;if(!s)return;if(ST.demo)return setSave('ok');
 try{const st=await token();
  if(s.lib){s.chordsAt=Date.now();await req('PATCH',FB.base+'/library/'+s.id+'?updateMask.fieldPaths=chords&updateMask.fieldPaths=key&updateMask.fieldPaths=chordsAt',{fields:{chords:{stringValue:JSON.stringify(libChordsOf(s))},key:{stringValue:s.key||''},chordsAt:{integerValue:String(s.chordsAt)}}},{Authorization:'Bearer '+st.token});renderList();return setSave('ok','lib')}
  s.updated=Date.now();
  await req('PATCH',FB.base+'/users/'+st.uid+'/appSongs/'+s.id+'?updateMask.fieldPaths=j&updateMask.fieldPaths=u',{fields:{j:{stringValue:JSON.stringify(s)},u:{integerValue:String(s.updated)}}},{Authorization:'Bearer '+st.token});setSave('ok')}
 catch(e){setSave('err')}}
function setSave(k,w){const e=$('#save');e.className='save'+(k==='busy'?' busy':'');e.textContent=k==='draft'?'טיוטה · לחץ "אשר ושמור במאגר"':k==='busy'?'שומר…':k==='err'?'⚠ השמירה נכשלה':(w==='lib'||(ST.cur&&ST.cur.lib)?'✓ נשמר במאגר · ייכנס עם האקורדים למי שיוסיף את השיר':'✓ נשמר · יופיע באפליקציה');if(k==='err')e.style.color='#E0675C';else e.style.color=''}

/* ---------- chords helpers ---------- */
function own(s){return s.parts.filter(p=>!p.ref&&p.type!=='note'&&String(p.text||'').trim())}
function chordCount(s){return own(s).reduce((n,p)=>n+((p.chords||[]).length),0)}
function diatonic(key){const m=String(key||'').match(/^([A-G][#b]?)(m?)$/);if(!m)return ['C','Dm','Em','F','G','Am','E','A7'];
 const r=NI[m[1]],nm=i=>NOTES[(r+i)%12];
 return m[2]?[nm(0)+'m',nm(5)+'m',nm(7)+'m',nm(7),nm(3),nm(8),nm(10),nm(2)+'dim']:[nm(0),nm(2)+'m',nm(4)+'m',nm(5),nm(7),nm(9)+'m',nm(4),nm(7)+'7']}
function normChord(t){t=String(t||'').trim().replace(/^([a-g])/,c=>c.toUpperCase());return CHORD_RX.test(t)?t:''}
function snap(){ST.hist.push(JSON.stringify(ST.cur.parts));if(ST.hist.length>80)ST.hist.shift()}
function setChord(c){const sel=ST.sel;if(!sel)return;const p=ST.cur.parts.find(x=>x.id===sel.p);if(!p)return;snap();
 const t=p.text.split('\n')[sel.l];p.chords=(p.chords||[]).filter(x=>!(x.l===sel.l&&x.i===sel.i));
 if(c){p.chords.push({l:sel.l,i:sel.i,n:1,c,t});ST.recent=[c].concat(ST.recent.filter(x=>x!==c)).slice(0,8)}
 renderSong(true);saveSoon()}
function copyPrev(pid){const s=ST.cur,list=own(s),k=list.findIndex(p=>p.id===pid);if(k<0)return;const p=list[k];
 const prev=list.slice(0,k).reverse().find(x=>x.type===p.type&&(x.chords||[]).length);if(!prev)return alert('אין חלק קודם מאותו סוג עם אקורדים');
 snap();const pl=p.text.split('\n');p.chords=[];
 (prev.chords||[]).forEach(c=>{if(c.l<pl.length&&pl[c.l].trim()){const len=clusters(pl[c.l]).length;p.chords.push({l:c.l,i:Math.min(c.i,len-1),n:1,c:c.c,t:pl[c.l]})}});
 renderSong(true);saveSoon()}

/* ---------- web chords (Tab4U through a public proxy) ---------- */
function hasDraft(s){return own(s).some(p=>(p.chords||[]).some(c=>c.d))}
function draftCount(s){return own(s).reduce((n,p)=>n+(p.chords||[]).filter(c=>c.d).length,0)}
const PROXIES=[
 ['allorigins',u=>'https://api.allorigins.win/get?url='+encodeURIComponent(u),'json'],
 ['allorigins-raw',u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)],
 ['codetabs',u=>'https://api.codetabs.com/v1/proxy/?quest='+encodeURIComponent(u)],
 ['corsproxy',u=>'https://corsproxy.io/?url='+encodeURIComponent(u)],
 ['cors.lol',u=>'https://api.cors.lol/?url='+encodeURIComponent(u)],
 ['everyorigin',u=>'https://everyorigin.jwvbremen.nl/get?url='+encodeURIComponent(u),'json'],
 ['thingproxy',u=>'https://thingproxy.freeboard.io/fetch/'+u]];
let PX=0;
async function pget(url){const errs=[];const own=(localStorage.getItem('sp-proxy')||'').trim();
 const list=own?[['שלך',u=>own+(own.includes('?')?'':'?url=')+encodeURIComponent(u)]].concat(PROXIES):PROXIES;
 for(let k=0;k<list.length;k++){const i=own?k:(PX+k)%list.length,[n,f,kind]=list[i];
  try{const ac=new AbortController(),t=setTimeout(()=>ac.abort(),12000);const r=await fetch(f(url),{signal:ac.signal});clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);
   let tx=await r.text();if(kind==='json'){const j=JSON.parse(tx);tx=j.contents||j.data||'';if(/^data:/.test(tx))tx=atob(tx.split(',')[1]||'')}
   if(tx.length<300)throw new Error('ריק');if(/cf-browser-verification|challenge-platform|Just a moment/i.test(tx))throw new Error('חסום');if(!own)PX=i;return tx}
  catch(e){errs.push(n+': '+(e.name==='AbortError'?'זמן':String(e.message||e).slice(0,40)))}}
 const e=new Error('כל השרתים נכשלו');e.detail=errs.join(' · ');throw e}
function showSrc(src){document.body.classList.toggle('src',!!src);$('#srcP').hidden=!src;if(!src){$('#srcB').innerHTML='';return}
 $('#srcA').textContent=src.name+' ↗';$('#srcA').href=src.url;
 $('#srcB').innerHTML=src.rows.map(r=>'<div class="row'+(r.c?' c':'')+'" style="direction:'+(r.c&&ST.flip?(r.dir==='ltr'?'rtl':'ltr'):(r.dir||'rtl'))+'">'+esc(r.t)+'</div>').join('')}
async function tab4uFind(s){const words=normW(s.title).split(' ').filter(w=>w.length>1);
 const h=await pget('https://www.tab4u.com/resultsSimple?tab=songs&q='+encodeURIComponent(s.title));
 const d=new DOMParser().parseFromString(h,'text/html');let best=null,bs=-1;
 d.querySelectorAll('a[href*="tabs/songs/"]').forEach(a=>{const t=normW(a.textContent+' '+(a.closest('tr,li')||a).textContent);if(!t)return;
  let sc=words.filter(w=>t.includes(w)).length/Math.max(1,words.length);if(s.artist&&normW(s.artist).split(' ').some(w=>w.length>1&&t.includes(w)))sc+=.5;
  if(sc>bs){bs=sc;best=new URL(a.getAttribute('href'),'https://www.tab4u.com/').href}});
 const nl=d.querySelectorAll('a[href*="tabs/songs/"]').length;ST.diag='נמצאו '+nl+' תוצאות ב-Tab4U'+(best?', ההתאמה הטובה ביותר '+Math.round(bs*100)+'%':'');
 if(!best||bs<.6)return null;return best}
function sheetRows(html){const d=new DOMParser().parseFromString(html,'text/html');
 const root=d.querySelector('#songContentTPL')||d.querySelector('.song_block')||d.body;let rows=[];
 const tds=[...root.querySelectorAll('td')].filter(td=>!td.querySelector('td'));
 if(tds.length>3)rows=tds.map(td=>{const dl=td.closest('[dir]'),st=(td.getAttribute('style')||'')+' '+((td.closest('[style*=direction]')||{}).getAttribute?td.closest('[style*=direction]').getAttribute('style'):'');const dir=/direction\s*:\s*ltr/i.test(st)?'ltr':dl?dl.getAttribute('dir'):'';return {t:td.textContent.replace(/\r/g,'').replace(/\n/g,''),dir}});
 else rows=(root.innerText||root.textContent).split('\n').map(t=>({t,dir:''}));
 return rows.map(r=>({t:r.t.replace(/\s+$/,''),dir:r.dir})).filter(r=>r.t.trim()).map(r=>({t:r.t,dir:r.dir,c:isChordLine(r.t)}))}
/* place chords exactly as the site shows them: the chord row is rendered above its lyric row (RTL, like the site) and positions are measured */
function measurePairs(rows){const box=$('#srcB');const out=[];const els=[...box.querySelectorAll('.row')];
 for(let k=0;k<rows.length-1;k++){if(!rows[k].c||rows[k+1].c)continue;const ce=els[k],le=els[k+1];const ctn=ce&&ce.firstChild,ltn=le&&le.firstChild;if(!ctn||!ltn)continue;
  const r=document.createRange(),chs=[],re=/\S+/g;let m;
  while((m=re.exec(ctn.data))){if(!CHORD_TOK.test(m[0]))continue;r.setStart(ctn,m.index);r.setEnd(ctn,m.index+m[0].length);const q=r.getBoundingClientRect();chs.push({c:m[0],x:(q.left+q.right)/2})}
  const cl=[...ltn.data.matchAll(/\P{M}\p{M}*|\p{M}+/gu)];const pos=[];
  cl.forEach(mm=>{r.setStart(ltn,mm.index);r.setEnd(ltn,mm.index+mm[0].length);const q=r.getBoundingClientRect();pos.push({l:q.left,r:q.right,ch:mm[0]})});
  const place=[];
  chs.forEach(c=>{let bi=-1,bd=1e9;pos.forEach((p,i)=>{if(!p.ch.trim())return;const d=c.x<p.l?p.l-c.x:c.x>p.r?c.x-p.r:0;if(d<bd){bd=d;bi=i}});if(bi>=0)place.push({gi:bi,c:c.c})});
  out.push({lyr:ltn.data,place})}
 return out}
/* a chord at letter gi of the site's line goes to the same word number + letter offset in the library line */
const SEP=/[\s,.\-–—!?'"״׳:;()]/;
function isSp(ch){const t=stripNik(ch);return !t.trim()||SEP.test(t)}
function wordPos(g,gi){let w=-1,off=0,inW=false;for(let i=0;i<=gi&&i<g.length;i++){if(!isSp(g[i])){if(!inW){w++;off=0;inW=true}else off++}else inW=false}return {w:Math.max(0,w),off}}
function posOfWord(g,w,off){let k=-1,inW=false,start=-1,len=0;for(let i=0;i<g.length;i++){if(!isSp(g[i])){if(!inW){k++;inW=true;if(k===w){start=i;len=0}}if(k===w)len++}else inW=false}
 if(start<0)return Math.max(0,g.length-1);return start+Math.min(off,Math.max(0,len-1))}
function sim(a,b){a=normW(a);b=normW(b);if(!a||!b)return 0;if(a===b)return 1;const A=a.split(' '),B=new Set(b.split(' '));return A.filter(w=>B.has(w)).length/Math.max(A.length,B.size)}
const GR=t=>[...String(t).matchAll(/\P{M}\p{M}*|\p{M}+/gu)].map(x=>x[0]);
function applySheet(s,pairs){let n=0;snap();const lines=[];own(s).forEach(p=>p.text.split('\n').forEach((l,li)=>{if(l.trim())lines.push({p,li,l})}));
 own(s).forEach(p=>p.chords=(p.chords||[]).filter(c=>!c.d));
 let j=0;
 lines.forEach(L=>{let bi=-1,bs=.5;for(let k=0;k<pairs.length;k++){const v=sim(L.l,pairs[k].lyr)+(k>=j?.05:0);if(v>bs){bs=v;bi=k}}
  if(bi<0)return;j=bi+1;const pr=pairs[bi],gS=GR(pr.lyr),gL=GR(L.l);
  pr.place.forEach(pc=>{const wp=wordPos(gS,pc.gi),i=posOfWord(gL,wp.w,wp.off);if((L.p.chords||[]).some(c=>c.l===L.li&&c.i===i))return;(L.p.chords=L.p.chords||[]).push({l:L.li,i,n:1,c:pc.c,t:L.l,d:true});n++})});
 return n}
async function webChords(s){ST.find={id:s.id,busy:true,msg:'מחפש את "'+s.title+'" ב-Tab4U…'};renderSong(true);
 try{const url=await tab4uFind(s);if(ST.cur!==s)return;
  if(!url){ST.find={id:s.id,msg:'לא נמצא השיר ב-Tab4U ('+(ST.diag||'')+'). אפשר להוסיף אקורדים ידנית.'};return renderSong(true)}
  ST.find.msg='קורא את דף האקורדים…';renderSong(true);
  const h=await pget(url);if(ST.cur!==s)return;const rows=sheetRows(h);
  if(!rows.some(r=>r.c)){ST.find={id:s.id,msg:'נמצא דף לשיר, אבל לא זיהיתי בו אקורדים.'};showSrc({name:'Tab4U',url,rows});return renderSong(true)}
  ST.flip=false;ST.lastSrc={name:'Tab4U',url,rows};showSrc(ST.lastSrc);await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const n=applySheet(s,measurePairs(rows));ST.find={id:s.id,src:'Tab4U',msg:n?'':'נמצא דף אקורדים, אבל השורות שלו לא תואמות למילים בשיר. אפשר להעתיק ידנית מהמקור שבצד.'};renderSong(true);setSave(n?'draft':'ok')}
 catch(e){if(ST.cur!==s)return;ST.find={id:s.id,msg:'החיפוש ברשת נכשל: '+String(e.message||e).slice(0,60)+(e.detail?' ('+e.detail+')':'')};renderSong(true)}}

 const arr=ST.songs.filter(s=>(!q||(s.title+' '+(s.artist||'')).toLowerCase().includes(q))&&(ST.f==='all'||(ST.f==='no'?!chordCount(s):ST.f==='done'?!!s.chordsAt:chordCount(s)>0)));
 if(ST.f==='done')arr.sort((a,b)=>(b.chordsAt||0)-(a.chordsAt||0));
 $('#list').innerHTML=arr.map(s=>{const n=chordCount(s);return '<button class="it'+(ST.cur&&ST.cur.id===s.id?' on':'')+'" data-id="'+esc(s.id)+'"><span class="av">'+esc((s.artist||s.title||'·').trim()[0])+'</span><span class="tt"><b>'+esc(s.title)+'</b><small>'+esc(s.artist||'')+'</small>'+(s.chordsAt?'<span class="done">✓ חזר למאגר · '+fmtD(s.chordsAt)+'</span>':'')+'</span><span class="badge'+(n?'':' no')+'">'+(n?n+' אקורדים':'אין')+'</span></button>'}).join('')||'<div class="empty" style="font-size:15px;margin-top:40px">לא נמצאו שירים</div>'}

function moveSel(dir,unit){const s=ST.cur;if(!s||!ST.sel)return;const parts=own(s);

 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();return moveSel(e.key==='ArrowDown'?1:-1,'line')}
 if(e.key==='Enter'&&inCin){e.preventDefault();const c=normChord(e.target.value);if(e.target.value.trim()&&!c){e.target.style.borderColor='#E0675C';return}setChord(c);return moveSel(1,'word')}
 if((e.key==='Delete'||(e.key==='Backspace'&&inCin&&!e.target.value))){e.preventDefault();setChord('');return}
 if(!inCin&&/^[a-gA-G]$/.test(e.key)){const c=$('#cin');if(c){c.value='';c.focus()}}});
$('#ggo').onclick=async()=>{const er=$('#lerr');if(!window.firebase)return er.textContent='רכיב ההתחברות לא נטען';
 const app=firebase.apps.length?firebase.app():firebase.initializeApp({apiKey:FB.key,authDomain:'stagepromt.firebaseapp.com',projectId:FB.project});
 const prov=new firebase.auth.GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
 try{const r=await app.auth().signInWithPopup(prov);const t=await r.user.getIdTokenResult();
  localStorage.setItem(FB.LS,JSON.stringify({uid:r.user.uid,email:r.user.email,name:r.user.displayName,refresh:r.user.refreshToken,token:t.token,exp:new Date(t.expirationTime).getTime()-60000}));start()}
 catch(x){if(!/popup-closed|cancelled/.test(x.code||''))er.textContent='ההתחברות נכשלה: '+(x.code||x.message)}};
function showApp(){const au=auth();$('#mode').hidden=!(ST.demo||(au&&String(au.email||'').toLowerCase()===OWNER));$('#login').hidden=true;$('#side').hidden=false;$('#main').hidden=false;const a=auth()||{email:'aviad@example.com'};$('#user').innerHTML=esc(a.email||'')+'<i>'+esc((a.name||a.email||'?')[0].toUpperCase())+'</i>'}
async function start(){if(!auth()){$('#login').hidden=false;return}showApp();
 try{ST.mine=ST.songs=await loadSongs();const au=auth();if(au&&String(au.email||'').toLowerCase()===OWNER){await setMode('lib')}else{renderList();renderSong()}setSave('ok');$('#save').textContent=ST.songs.length+' שירים בחשבון'}catch(e){$('#sc').innerHTML='<div class="empty">לא הצלחתי לטעון את השירים. '+esc(String(e.message).slice(0,120))+'</div>'}}
if(new URLSearchParams(location.search).get('demo')){ST.demo=true;window.__demo=(d,lib)=>{ST.mine=ST.songs=d;ST.lib=lib||[];showApp();renderList();openSong(d[0].id);ST.recent=['Am','G'];renderPal();setSave('ok')}}
else start();
</script>
