<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111214">
<title>StagePromt – פרומפטר מילים</title>
<link rel="stylesheet" href="fonts.css">
<style>
:root{--bg:#111214;--p1:#1A1C20;--p2:#15171A;--fld:#1B1D22;--ln:#26292F;--ln2:#2E3138;--tx:#F2EEE6;--mu:#A09A90;--mu2:#8F897F;--am:#E8A33D;--amT:#2A2419;--amB:#4A3E28;--ve:#E8A33D;--ch:#7DB8F0;--br:#C9A6F0;--no:#8F897F;--ui:'Assistant','Segoe UI',sans-serif;--ti:'Rubik','Assistant',sans-serif;--bf:'Frank Ruhl Libre',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--am);outline-offset:2px}
svg{flex-shrink:0}
[hidden]{display:none!important}
select option{background:#1A1C20;color:#F2EEE6}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
.hdr{height:76px;padding:0 24px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--ln);flex-shrink:0}
.flex1{flex:1}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.btn{height:46px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--fld);color:var(--tx);border:1px solid var(--ln2);border-radius:12px;font-size:16px;font-weight:600;white-space:nowrap;flex-shrink:0}
.btn:active:not(:disabled),.ib:active:not(:disabled),.pb:active:not(:disabled){transform:scale(.96)}
.btn.pri{background:var(--am);color:#111214;border-color:var(--am);font-weight:800}
.btn.dash{background:transparent;border-style:dashed}
.btn.sm{height:40px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.big{height:54px;font-size:18px;border-radius:14px;width:100%}
.ib{width:46px;height:46px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--fld);color:var(--tx);border:1px solid var(--ln2);border-radius:12px;flex-shrink:0}
.ib.sm{width:40px;height:40px;border-radius:10px}
.ib.ghost{background:transparent;border-color:transparent;color:var(--mu)}
.ib.danger{color:#FF9A8F}
.lbl{font-size:13px;font-weight:700;color:var(--mu2);letter-spacing:.3px}
.hint{font-size:13px;color:var(--mu2);line-height:1.55;padding:6px 4px}
.seg{display:flex;gap:4px;background:var(--fld);padding:4px;border-radius:11px;border:1px solid var(--ln2);flex-shrink:0}
.seg button{height:38px;padding:0 14px;background:transparent;color:var(--mu);border:0;border-radius:8px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.seg button.on{background:var(--ln2);color:var(--tx);font-weight:700}
.seg.full button{flex:1}
.field{height:46px;padding:0 14px;background:var(--fld);border:1px solid var(--ln2);border-radius:12px;font-size:16px;color:var(--tx);outline:none;width:100%}
.pill{width:24px;height:24px;border-radius:6px;color:#111214;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.t-verse{background:var(--ve)}.t-chorus{background:var(--ch)}.t-bridge{background:var(--br)}.t-note{background:var(--no)}
.c-verse{color:#F3D9A8}.c-chorus{color:#A9D2FA}.c-bridge{color:#D8C2F5}.c-note{color:#9A958C}
.spin{width:22px;height:22px;border:3px solid #34373D;border-top-color:var(--am);border-radius:50%;display:inline-block;animation:sp .8s linear infinite}
.spin.big{width:42px;height:42px;border-width:4px}
@keyframes sp{to{transform:rotate(360deg)}}
.tgl{display:flex;align-items:center;gap:10px;font-size:15px;min-height:44px;cursor:pointer}
.tgl input{width:22px;height:22px;accent-color:var(--am);flex-shrink:0}
input[type=range]{accent-color:var(--am);width:100%;height:32px}

/* library */
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:11px;background:var(--am);color:#111214;display:flex;align-items:center;justify-content:center}
.logoImg{height:46px;width:auto;display:block}
.brand span{font-size:15px;color:var(--mu);padding-top:6px}
.search{width:320px;height:46px;padding:0 14px;display:flex;align-items:center;gap:10px;background:var(--fld);border:1px solid var(--ln2);border-radius:12px;color:var(--mu)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-size:16px;color:var(--tx)}
.libBody{flex:1;display:flex;min-height:0}
.nav{width:264px;padding:22px 16px;border-left:1px solid var(--ln);display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.navLbl{padding:14px 12px 6px}
.foldRow{display:flex;align-items:center;border-radius:10px;flex-shrink:0}
.foldRow.on{background:var(--amT)}
.fold{flex:1;min-width:0;height:48px;padding:0 12px;display:flex;align-items:center;gap:12px;background:transparent;color:#D8D3CA;border:0;border-radius:10px;font-size:16px;text-align:right}
.foldRow.on .fold{color:#F4C77A}
.fold .nm{flex:1;font-family:var(--ti);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .ct{color:var(--mu2);font-size:14px}
.foldRow.on .ct{color:#F4C77A}
.fmore{width:40px;height:40px;margin-left:4px;display:none;align-items:center;justify-content:center;background:transparent;border:0;border-radius:8px;color:#F4C77A}
.foldRow.on .fmore{display:flex}
.newFold{margin-top:10px;color:var(--am);border-color:#4A4032;justify-content:flex-start;font-size:15px;font-weight:700}
.legend{margin-top:18px;padding:16px;background:var(--fld);border-radius:14px;display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.legend div{display:flex;align-items:center;gap:10px;font-size:15px}
.legend i{width:14px;height:14px;border-radius:4px;display:block}
.main{flex:1;min-width:0;display:flex;flex-direction:column;padding:24px 28px 20px;gap:18px}
.mhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.mhead h1{margin:0;font-family:var(--ti);font-size:32px;font-weight:600;letter-spacing:-.3px;line-height:1.2}
.mhead .sub{color:var(--mu);font-size:15px;margin-top:4px}
.grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-content:start;padding:2px 2px 8px}
.card{background:var(--p1);border:1px solid #2A2D33;border-radius:16px;display:flex;align-items:stretch;min-height:112px}
.cardOpen{flex:1;min-width:0;padding:16px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:transparent;border:0;color:var(--tx);text-align:right;border-radius:16px}
.cardOpen .ttl{font-family:var(--ti);font-size:20px;font-weight:600;letter-spacing:-.2px;line-height:1.25;display:flex;align-items:center;gap:6px}
.favS{color:var(--am);display:inline-flex}
.cardOpen .art{font-size:14px;color:var(--mu);margin-top:-6px;min-height:18px}
.pills{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.pills .more,.pdfInfo{font-size:13px;color:var(--mu)}
.cardOpen .meta{font-size:13px;color:var(--mu2);margin-top:auto}
.side{display:flex;flex-direction:column;gap:6px;padding:12px 12px 12px 0;align-items:center}
.playBtn{width:46px;height:46px;border-radius:50%;background:var(--ln2);color:var(--tx);border:0;display:flex;align-items:center;justify-content:center}
.playBtn:active{background:var(--am);color:#111214}
.badge{height:24px;padding:0 9px;border-radius:12px;background:#2B2230;color:#D9BFF5;font-size:12px;font-weight:800;display:inline-flex;align-items:center}
.selRow .lOpen{gap:12px}.selBox{width:26px;height:26px;flex-shrink:0;border:2px solid #5A5D64;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#1A1205}.selRow.on .selBox{background:var(--am);border-color:var(--am)}.selRow.on{background:#2A2419;border-radius:14px}.selbar{gap:10px}.selbar b{font-size:17px}.btn.danger{color:#FF9A8F;border-color:#5A2A26}.btn.danger:disabled,.selbar .btn:disabled{opacity:.4}
.setbar{height:72px;padding:0 20px;display:flex;align-items:center;gap:16px;background:#1F1B14;border:1px solid #3D3322;border-radius:16px;flex-shrink:0;color:var(--am)}
.sbTxt{min-width:0;color:var(--tx)}
.sbTxt b{display:block;font-size:17px;font-weight:800}
.sbTxt span{display:block;font-size:14px;color:#BFB39E;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navTop{display:flex;justify-content:flex-end;margin:-8px 0 8px}
#lib.navHidden .nav{display:none}
.grid.asList{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;background:var(--p1);border:1px solid #2A2D33;border-radius:12px;min-height:62px;flex-shrink:0}
.lOpen{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:8px 16px;background:transparent;border:0;color:var(--tx);text-align:right;min-height:60px;border-radius:12px}
.lNum{width:26px;color:var(--mu2);font-size:15px;font-weight:700;text-align:center;flex-shrink:0}
.lTitle{font-family:var(--ti);font-size:18px;font-weight:600;min-width:0;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.lArt{flex:1;min-width:0;color:var(--mu);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .pills{flex-wrap:nowrap;flex-shrink:0}
.lside{display:flex;gap:6px;padding:0 10px;align-items:center}
.playBtn.sm{width:40px;height:40px}
@media (max-width:760px){.lrow .pills{display:none}}
.emptyLib{grid-column:1/-1;padding:70px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:var(--mu)}
.emptyLib h2{margin:0;color:var(--tx);font-family:var(--ti);font-weight:600;font-size:24px}
.emptyLib div{display:flex;gap:10px}

/* editor */
.edTitles{min-width:0;display:flex;flex-direction:column}
.titleIn{background:transparent;border:0;outline:none;font-family:var(--ti);font-size:25px;font-weight:600;color:var(--tx);padding:0;width:340px;max-width:100%}
.edSub{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mu)}
.edSub input{background:transparent;border:0;outline:none;color:var(--mu);font-size:14px;width:140px;padding:0}
.edSub select{background:transparent;border:0;color:var(--mu);font-size:14px;outline:none;max-width:170px}
.edBody{flex:1;display:flex;min-height:0}
.struct{width:236px;padding:20px 14px;border-left:1px solid var(--ln);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.struct .lbl{padding:0 6px 6px}
.sItem{display:flex;align-items:center;gap:2px;background:var(--p1);border-radius:10px;flex-shrink:0}
.sName{flex:1;min-width:0;height:46px;padding:0 10px;display:flex;align-items:center;gap:10px;background:transparent;border:0;color:var(--tx);font-size:16px;text-align:right;border-radius:10px}
.sName .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.sName .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sName .rep{font-size:12px;color:var(--mu2)}
.mv{width:34px;height:40px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:8px;color:var(--mu)}
.edMain{flex:1;min-width:0;padding:20px 24px 40px;display:flex;flex-direction:column;gap:14px}
.block{background:var(--p1);border:1px solid #2A2D33;border-radius:16px;padding:12px 18px 14px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.block:focus-within{border-color:var(--amB)}
.block.ref{background:#16181B;border-style:dashed}
.bHead{display:flex;align-items:center;gap:8px}
.chip{height:30px;padding:0 12px;border-radius:8px;color:#111214;font-size:14px;font-weight:800;border:0;-webkit-appearance:none;appearance:none;display:inline-flex;align-items:center;flex-shrink:0}
select.chip{cursor:pointer}
.bHead .cnt{font-size:13px;color:var(--mu2)}
.block textarea{resize:none;background:transparent;border:0;outline:none;font-size:22px;font-weight:700;line-height:1.55;padding:0;width:100%;overflow:hidden;min-height:34px}
.block textarea::placeholder{color:#5C5850;font-weight:500}
.reptext{font-size:18px;color:#6E695F;line-height:1.5}
.reptext .rl.hasCh{padding-top:.7em}
.reptext .rgap{height:.5em}
.reptext .ch{font-size:.7em;opacity:.85}
.addRow{display:flex;gap:10px;flex-wrap:wrap;flex-shrink:0}
.addRow.mini{gap:6px;margin:-4px 0 6px}
.addRow.mini .btn{height:36px;padding:0 11px;font-size:13px;border-radius:9px}
.ad-verse{color:var(--ve)!important;border-color:#4A4032!important}
.ad-chorus{color:var(--ch)!important;border-color:#2C4056!important}
.ad-bridge{color:var(--br)!important;border-color:#43385A!important}
.ad-note{color:var(--mu)!important}
.emptyEd{max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.emptyEd h2{margin:6px 0 0;font-family:var(--ti);font-size:24px;font-weight:600}
.emptyEd p{margin:0;color:var(--mu);font-size:15px;line-height:1.6}
.bigText{min-height:320px;resize:vertical;background:var(--p1);border:1px solid var(--ln2);border-radius:14px;padding:16px 18px;font-size:19px;line-height:1.6;color:var(--tx);outline:none;width:100%}
.style{width:300px;padding:20px;border-right:1px solid var(--ln);background:var(--p2);display:flex;flex-direction:column;gap:20px;flex-shrink:0}
.grp{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px}
.row b{font-size:16px;font-weight:800}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fontBtn{height:54px;background:var(--fld);color:var(--tx);border:1px solid var(--ln2);border-radius:10px;font-size:18px;padding:0 6px}
.fontBtn:last-child:nth-child(odd){grid-column:1/-1}
.fontBtn.on{background:var(--amT);color:#F4C77A;border-color:var(--am)}
.swRow{display:flex;align-items:center;gap:7px}
.swRow .nm{width:50px;font-size:15px;flex-shrink:0}
.sw{width:30px;height:30px;border-radius:50%;border:0;padding:0;flex-shrink:0}
.sw.on{box-shadow:0 0 0 2px var(--p2),0 0 0 4px var(--am)}
.swRow input[type=color]{width:32px;height:32px;border:1px dashed #555;padding:2px;background:transparent;border-radius:50%;flex-shrink:0}
.preview{padding:16px;background:#000;border-radius:12px;display:flex;flex-direction:column;gap:4px}
.pvL{font-size:11px;color:var(--mu2);text-align:center}
.pdfCard{display:flex;gap:24px;align-items:flex-start;background:var(--p1);border:1px solid #2A2D33;border-radius:16px;padding:20px;flex-wrap:wrap}
.pdfPrev{width:260px;min-height:200px;display:flex;align-items:center;justify-content:center;background:#0C0D0F;border-radius:8px;overflow:hidden}
.pdfPrev canvas{width:100%;height:auto;display:block}
.pdfInfoBox{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pdfInfoBox b{font-family:var(--ti);font-size:20px;font-weight:600}
.pdfInfoBox span{color:var(--mu)}
.pdfInfoBox p{color:var(--mu);line-height:1.6;margin:4px 0 8px}

/* prompter */
#play{background:#000}
.pTop{height:56px;padding:0 12px 0 24px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.pTop .t{font-family:var(--ti);font-size:18px;font-weight:600;color:#CFC9BF;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pTop .n{font-size:15px;color:var(--mu2);white-space:nowrap}
.pTop .tm{font-size:18px;font-weight:700;color:#CFC9BF;font-variant-numeric:tabular-nums}
.prog{height:3px;background:#1C1C1C;margin:0 24px;flex-shrink:0}
.prog i{display:block;height:3px;background:var(--am);width:0;transition:background .25s}
.prog.last i{background:#FF4D4D;box-shadow:0 0 8px rgba(255,77,77,.6)}
.pStage{flex:1;position:relative;min-height:0}
.pBgA{position:absolute;inset:0;overflow:hidden;pointer-events:none}.pBgA[hidden]{display:none}
.glRows{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow:auto;margin:8px 0}.glRow{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid rgba(128,128,128,.3);border-radius:10px}.glRow small{display:block;opacity:.7}.glSt{font-size:12px;opacity:.8;white-space:nowrap}
.bgImg{position:absolute;inset:0;background:center/cover no-repeat;animation:bgKb 70s ease-in-out infinite alternate;transform-origin:50% 50%;backface-visibility:hidden}
@keyframes bgKb{from{transform:scale(1.0)}to{transform:scale(1.09)}}
.bgDim{position:absolute;inset:0}
.bglA{position:absolute;top:5px;right:5px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#BDB6AA;display:flex;align-items:center;justify-content:center}.bglA.on{background:#E8A33D;color:#1A1205;box-shadow:0 0 10px rgba(232,163,61,.7)}
#bgAnimT svg{margin-inline-end:6px}
.pScroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}
.pScroll::-webkit-scrollbar{display:none}
.pInner{padding:38vh 64px 72vh;max-width:1240px;margin:0 auto;font-weight:800}
.pInner.mirror{transform:scaleX(-1)}
.ln{line-height:var(--lh,1.35);opacity:.7;transition:opacity .25s}
.ln.past{opacity:.25}
.ln.cur{opacity:1}
.ln.note{font-size:.45em;font-style:italic;font-weight:600;font-family:var(--ui)}
.sec{font-family:var(--ui);font-size:max(16px,.26em);font-weight:800;letter-spacing:1px;margin:.9em 0 .1em;opacity:.85}
.gap{height:.45em}
.endHint{font-family:var(--ui);text-align:center;color:var(--mu2);font-size:20px;font-weight:600;padding:50px 0 0}
.pInner.pdf{padding:20px 24px 60vh;max-width:1150px}
.pdfPage{display:block;max-width:100%;height:auto;margin:0 auto 16px;border-radius:4px;background:#fff}
.pInner.pdf.inv .pdfPage{filter:invert(1) hue-rotate(180deg)}
.pLoad{color:var(--mu);font-size:18px;font-weight:600;display:flex;gap:12px;align-items:center;justify-content:center;padding-top:30vh}
.marker{position:absolute;right:16px;top:38%;width:0;height:0;border-top:14px solid transparent;border-bottom:14px solid transparent;border-right:18px solid var(--am);transform:translateY(-50%);pointer-events:none}
.pBarWrap{position:absolute;bottom:22px;left:0;right:0;display:flex;justify-content:center;pointer-events:none;padding:0 12px}
.pBar{pointer-events:auto;height:84px;padding:0 16px;display:flex;align-items:center;gap:12px;background:rgba(20,21,23,.95);border:1px solid #2A2D33;border-radius:22px;max-width:100%}
.pb{width:48px;height:48px;background:#1F2125;color:var(--tx);border:0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0}
.pb.big{width:62px;height:62px;border-radius:50%;background:var(--am);color:#111214}
.pb.clear{background:transparent;color:#CFC9BF}
.pb.on{background:var(--amT);color:#F4C77A}
.pb.wide{width:auto;padding:0 14px;gap:6px;font-size:14px;font-weight:700;color:#CFC9BF}
.vsep{width:1px;height:40px;background:#2A2D33;flex-shrink:0}
.spd{width:74px;text-align:center}
.spd b{display:block;font-size:20px;font-weight:800}
.spd small{font-size:12px;color:var(--mu2)}
.pNext{padding:0 4px;display:flex;flex-direction:column;min-width:0}
.pNext small{font-size:12px;color:var(--mu2)}
.pNext b{font-family:var(--ti);font-size:16px;font-weight:600;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.showBar{position:absolute;left:24px;bottom:24px;width:52px;height:52px;border-radius:50%;background:rgba(31,33,37,.55);color:var(--mu2);border:1px solid #2A2D33;display:none;align-items:center;justify-content:center}
#play.barHidden .pBarWrap{display:none}
#play.manual .onlyAuto{display:none}
#play:not(.manual) .onlyMan{display:none}
.pb.mode.on{background:var(--amT);color:#F4C77A}
.pPart{min-width:118px;text-align:center;display:flex;flex-direction:column;gap:2px}

<section id="lib" class="screen active">

    <main class="main">

<section id="edit" class="screen">

    <button class="ib" id="edBack" aria-label="חזרה לספרייה"><i data-ic="back"></i></button>

      <input id="edTitle" dir="auto" class="titleIn" aria-label="שם השיר">
      <div class="edSub"><input id="edArtist" placeholder="שם האמן" aria-label="שם האמן"><span>·</span><select id="edKey" aria-label="סולם" dir="ltr"></select></div>
    </div>
    <div class="flex1"></div>
    <button class="btn chUndo" id="chUndo" aria-label="בטל פעולה אחרונה" disabled><i data-ic="undo" data-s="18"></i>Undo</button>
    <button class="btn" id="edNik" aria-pressed="false"><span>ניקוד</span></button>
    <button class="btn" id="edChords" aria-pressed="false"><i data-ic="chord" data-s="18"></i>אקורדים</button>
    <button class="btn" id="edPaste"><i data-ic="clip" data-s="18"></i><span class="hideS">הדבק טקסט וחלק אוטומטית</span></button>

      <div class="pNext" id="pNextName"></div>
      <button class="pb wide" id="pHide" aria-label="הסתר סרגל כלים"><i data-ic="down" data-s="18"></i><span>הסתר</span></button>
    </div></div>
    <button class="showBar" id="pShow" aria-label="הצג סרגל כלים"><i data-ic="up"></i></button>

 const n={id:uid(),type:'note',text:'פזמון אחרון — פעמיים, להאט בסוף',ref:null};
 return {id:uid(),title:'אור ראשון (שיר לדוגמה)',artist:'',folderId,kind:'text',
  parts:[v1,c,v2,{id:uid(),type:'chorus',text:'',ref:c.id},b,n,{id:uid(),type:'chorus',text:'',ref:c.id}],
  style:clone(DEF_STYLE),fav:false,order:1,created:Date.now(),updated:Date.now()};

function load(){
 let d=null;
 try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!d||!Array.isArray(d.songs)){
  d={v:1,folders:[],songs:[sampleSong(null)],mig1:true};
 }
 d.folders=d.folders||[];
 if(!d.mig1){const df=d.folders.filter(f=>f.name.trim()==='השירים שלי').map(f=>f.id);d.folders=d.folders.filter(f=>!df.includes(f.id));d.songs.forEach(s=>{if(df.includes(s.folderId))s.folderId=null});d.mig1=true}
 d.ui=Object.assign({folder:'all',sort:'set',barHidden:false,mirror:false},d.ui||{});
 d.speed=d.speed||1;
 d.defStyle=d.defStyle||clone(DEF_STYLE);
 if(!d.mig2){d.songs.forEach(s=>(s.parts||[]).forEach(p=>{if(p.text)p.text=p.text.split('\n').map(l=>/\[[A-H]/.test(l)?stripChords(l):l).join('\n')}));d.mig2=true}
 d.songs=d.songs.filter(s=>!s.draft);
 d.songs.forEach(s=>{s.parts=s.parts||[];s.style=Object.assign(clone(DEF_STYLE),s.style||{});s.style.colors=Object.assign(clone(DEF_STYLE.colors),s.style.colors||{})});
 return d;
}

/* ========= auto split ========= */
const HDR=/^\s*[\[(]?\s*(בית|פזמון|פיזמון|גשר|מעבר|קודה|סיום|פתיחה|הערה|verse|chorus|pre-?chorus|bridge|intro|outro)\s*(\d+|[א-ו]['׳]?)?\s*[\])]?\s*[:：\-–]?\s*(?:[x×]\s*\d+|\d+\s*[x×])?\s*[\])]?\s*$/i;
const HDR_EN=/^\s*[\[(]\s*(verse|chorus|pre-?chorus|post-?chorus|bridge|intro|outro|hook|refrain|interlude|break|instrumental|solo)\b[^\])]*[\])]\s*$/i;
const HDR_INLINE=/^\s*(בית\s*\d*|פזמון|פיזמון|גשר|chorus|verse\s*\d*|bridge)\s*[:：]\s*(.+)$/i;
function hdrType(w){w=w.toLowerCase();if(/פזמון|פיזמון|^chorus|^hook|^refrain/.test(w))return 'chorus';if(/גשר|מעבר|bridge|pre|post|קודה|סיום|outro|פתיחה|intro|interlude|break|instrumental|solo/.test(w))return 'bridge';if(/הערה/.test(w))return 'note';return 'verse'}
/* ========= strip chords (lyrics only) ========= */
const CHORD_TOK=/^[A-H](?:#|b|♯|♭)?(?:maj|min|dim|aug|sus|add|m|M|°|ø|\+)?\d*(?:(?:sus|add|maj|b|#|\+|-)\d+)*(?:\/[A-H](?:#|b|♯|♭)?)?$/;
const isChord=t=>CHORD_TOK.test(t);
function isChordLine(l){
 const t=String(l||'').replace(/\u00a0/g,' ').trim();if(!t)return false;
 const toks=t.split(/\s+/);let n=0;
 for(const k of toks){if(isChord(k))n++;else if(!/^(\||-|\(?x\d\)?|\d+x|\(|\)|\/|\.+|N\.C\.?)$/i.test(k))return false}
 return n>0;
}
function stripChords(s){const rx=/^[A-H](?:#|b|♯|♭)?(?:maj|min|dim|aug|sus|add|m|M|°|ø|\+)?\d*(?:(?:sus|add|maj|b|#|\+|-)\d+)*(?:\/[A-H](?:#|b|♯|♭)?)?$/;return String(s||'').replace(/\[([^\]\s]{1,12})\]/g,(m,c)=>rx.test(c)?'':m).replace(/ {2,}/g,' ').trim()}
function lyricsOnly(text){
 return String(text||'').replace(/\r/g,'').split('\n').filter(l=>!isChordLine(l)).map(l=>stripChords(l.replace(/[\u00a0\t]+/g,' '))).join('\n');
}

function normKey(t){return String(t).replace(/\uE000[^\uE001]*\uE001/g,'').split('\n').map(l=>l.trim().replace(/[.,!?״"'׳\-–:;()]/g,'').replace(/\s+/g,' ')).filter(Boolean).join('\n')}
function autoSplit(raw){
 const text=lyricsOnly(String(raw||'').replace(/\r\n?/g,'\n'));
 const blocks=text.replace(/\n(?=[ \t]*\[(verse|chorus|pre-?chorus|post-?chorus|bridge|intro|outro|hook|refrain)\b)/gi,'\n\n').split(/\n[ \t]*\n+/).map(b=>b.split('\n').map(l=>l.replace(/\s+$/,'').replace(/^\s+/,'')).filter(l=>l!=='').join('\n')).filter(Boolean);
 const pre=blocks.map(b=>{
  let lines=b.split('\n'),type=null;
  const m=lines[0].match(HDR)||lines[0].match(HDR_EN);
  if(m){type=hdrType(m[1]);lines=lines.slice(1)}
  else{const mi=lines[0].match(HDR_INLINE);if(mi){type=hdrType(mi[1]);lines[0]=mi[2].trim()}}
  return {type,text:lines.join('\n').trim()};
 });
 const cnt={};pre.forEach(p=>{if(p.text){const k=normKey(p.text);cnt[k]=(cnt[k]||0)+1}});
 const parts=[],seen={},last={};
 pre.forEach(p=>{
  if(!p.text){const t=p.type||'chorus';const src=last[t];if(src)parts.push({id:uid(),type:t,text:'',ref:src.id});return}
  const k=normKey(p.text);
  if(seen[k]){parts.push({id:uid(),type:seen[k].type,text:'',ref:seen[k].id});return}
  const type=p.type||(cnt[k]>1?'chorus':'verse');
  const part={id:uid(),type,text:p.text,ref:null};
  parts.push(part);seen[k]=part;last[type]=part;
 });
 return parts;
}

const CH_ROOTS=['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B'];

const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const Q_ALIAS={maj:'',M:'',min:'m','-':'m',M7:'maj7','Δ':'maj7','Δ7':'maj7','°':'dim','°7':'dim7','+':'aug','ø':'m7b5','ø7':'m7b5',sus:'sus4',mi:'m',mi7:'m7',min7:'m7',m7b5:'m7b5'};

const SH_E={'':[0,2,2,1,0,0],m:[0,2,2,0,0,0],'7':[0,2,0,1,0,0],m7:[0,2,0,0,0,0],maj7:[0,X,1,1,0,X],'6':[0,2,2,1,2,0],m6:[0,2,2,0,2,0],add9:[0,2,2,1,0,2],sus4:[0,2,2,2,0,0],'7sus4':[0,2,0,2,0,0],dim:[0,1,2,0,X,X],aug:[0,3,2,1,1,0],m7b5:[0,1,0,0,X,X],'5':[0,2,2,X,X,X]};
const SH_A={'':[X,0,2,2,2,0],m:[X,0,2,2,1,0],'7':[X,0,2,0,2,0],m7:[X,0,2,0,1,0],maj7:[X,0,2,1,2,0],'6':[X,0,2,2,2,2],m6:[X,0,2,-1,1,X],'9':[X,0,-1,0,0,0],add9:[X,0,2,4,2,0],sus2:[X,0,2,2,0,0],sus4:[X,0,2,2,3,0],'7sus4':[X,0,2,0,3,0],dim:[X,0,1,2,1,X],dim7:[X,0,1,-1,1,X],aug:[X,0,3,2,2,1],m7b5:[X,0,1,0,1,X],'5':[X,0,2,2,X,X]};
const OPEN={C:[X,3,2,0,1,0],C7:[X,3,2,3,1,0],Cmaj7:[X,3,2,0,0,0],Cadd9:[X,3,2,0,3,0],Csus4:[X,3,3,0,1,1],C6:[X,3,2,2,1,0],
 D:[X,X,0,2,3,2],Dm:[X,X,0,2,3,1],D7:[X,X,0,2,1,2],Dm7:[X,X,0,2,1,1],Dmaj7:[X,X,0,2,2,2],Dsus2:[X,X,0,2,3,0],Dsus4:[X,X,0,2,3,3],D6:[X,X,0,2,0,2],Dm6:[X,X,0,2,0,1],Dadd9:[X,X,0,2,3,0],Ddim:[X,X,0,1,3,1],
 G:[3,2,0,0,0,3],G7:[3,2,0,0,0,1],Gmaj7:[3,2,0,0,0,2],G6:[3,2,0,0,0,0],Gsus4:[3,3,0,0,1,3],Gadd9:[3,X,0,2,0,3],
 B7:[X,2,1,2,0,2],Fmaj7:[X,X,3,2,1,0],E9:[0,2,0,1,0,2],A9:[X,0,2,4,2,3]};
function parseChord(n){
 const m=String(n||'').trim().match(/^([A-Ga-g])([#b♯♭]?)(.*?)(?:\/([A-Ga-g][#b♯♭]?))?$/);if(!m)return null;
 const r=m[1].toUpperCase(),acc=m[2].replace('♯','#').replace('♭','b');
 let q=m[3];if(Q_ALIAS[q]!=null)q=Q_ALIAS[q];
 const pc=(PC[r]+(acc==='#'?1:acc==='b'?-1:0)+12)%12;
 return {root:r+acc,pc,q,bass:m[4]||''};
}
function chordShape(n){
 const p=parseChord(n);if(!p)return null;
 const nm=CH_ROOTS[p.pc]+p.q,alt={'C#':'Db','Eb':'D#','F#':'Gb','Ab':'G#','Bb':'A#'};
 if(OPEN[p.root+p.q])return OPEN[p.root+p.q].slice();
 if(OPEN[nm])return OPEN[nm].slice();
 const cands=[];
 [[SH_E,4],[SH_A,9]].forEach(([T,open])=>{const t=T[p.q];if(!t)return;let r=(p.pc-open+12)%12;if(t.some(o=>o!==X&&r+o<0))r+=12;cands.push({r,f:t.map(o=>o===X?-1:r+o)})});
 if(!cands.length)return null;
 cands.sort((a,b)=>a.r-b.r);return cands[0].f;
}
function chordSvg(n,w){
 w=w||86;const f=chordShape(n),h=Math.round(w*1.16);
 const L=12,R=w-20,T=22,sx=(R-L)/5,fy=(h-T-6)/5;
 let s='<svg class="chD" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" aria-hidden="true" style="direction:ltr">';
 if(!f){return s+'<text x="'+(w/2)+'" y="'+(h/2)+'" text-anchor="middle" fill="#6B665E" font-size="12">—</text></svg>'}
 const played=f.filter(x=>x>0),mx=Math.max(0,...played),mn=played.length?Math.min(...played):1;
 const base=mx<=4?1:mn;
 for(let i=0;i<6;i++)s+='<line x1="'+(L+i*sx)+'" y1="'+T+'" x2="'+(L+i*sx)+'" y2="'+(T+5*fy)+'" stroke="#8B867D" stroke-width="1"/>';
 for(let j=0;j<=5;j++)s+='<line x1="'+L+'" y1="'+(T+j*fy)+'" x2="'+R+'" y2="'+(T+j*fy)+'" stroke="#8B867D" stroke-width="'+(j===0&&base===1?3.5:1)+'"/>';
 if(base>1)s+='<text x="'+(R+4)+'" y="'+(T+fy*.72)+'" fill="#A09A90" font-size="10" font-family="Rubik,sans-serif">'+base+'</text>';
 f.forEach((x,i)=>{const cx=L+i*sx;if(x<0)s+='<text x="'+cx+'" y="'+(T-7)+'" text-anchor="middle" fill="#A09A90" font-size="11" font-family="Rubik,sans-serif">×</text>';else if(x===0)s+='<circle cx="'+cx+'" cy="'+(T-10)+'" r="3.4" fill="none" stroke="#A09A90" stroke-width="1.3"/>'});
 // barre
 const fi=f.findIndex(x=>x>=0);let barre=0;
 if(mn>0&&f[fi]===mn&&f[5]===mn&&f.filter(x=>x===mn).length>=3&&!f.slice(fi).some(x=>x===0))barre=mn;
 if(barre){const y=T+(barre-base+.5)*fy;s+='<rect x="'+(L+fi*sx-5)+'" y="'+(y-5)+'" width="'+((5-fi)*sx+10)+'" height="10" rx="5" fill="#F2EEE6"/>'}
 f.forEach((x,i)=>{if(x>0&&x!==barre){const y=T+(x-base+.5)*fy;s+='<circle cx="'+(L+i*sx)+'" cy="'+y+'" r="'+Math.min(5.2,sx*.42)+'" fill="#F2EEE6"/>'}});
 return s+'</svg>';
}
/* chords are stored on the source part: p.chords=[{l,i,n,c,t}]  l=line index, i=char index, n=chars spanned, t=line text */
const NIK_RE=/[\u0591-\u05BD\u05BF\u05C1\u05C2\u05C4\u05C5\u05C7]/g;
const stripNik=t=>String(t||'').replace(NIK_RE,'');
const hasNik=t=>/[\u05B0-\u05BC\u05C1\u05C2\u05C7]/.test(t||'');
const clusters=t=>String(t||'').match(/\P{M}\p{M}*|\p{M}+/gu)||[];
function partChordMap(p){
 const out={};if(!p||!p.chords||!p.chords.length)return out;
 const lines=String(p.text||'').split('\n');
 p.chords=p.chords.filter(ch=>{
  if(stripNik(lines[ch.l])!==stripNik(ch.t)){
   let best=-1,bd=1e9;const tt=stripNik(ch.t);lines.forEach((l,j)=>{if(stripNik(l)===tt&&Math.abs(j-ch.l)<bd){bd=Math.abs(j-ch.l);best=j}});
   if(best>=0)ch.l=best;else if(lines[ch.l]&&lines[ch.l].trim())ch.t=lines[ch.l];else return false;
  }
  return true;
 });
 p.chords.forEach((ch,k)=>{const len=clusters(lines[ch.l]).length;ch.i=clamp(ch.i,0,Math.max(0,len-1));if(ch.i+(ch.n||1)>len)ch.n=1;(out[ch.l]=out[ch.l]||[]).push({i:ch.i,n:ch.n||1,c:ch.c,k})});
 return out;
}
function lineHtml(text,chs){
 if(!chs||!chs.length)return esc(text);
 chs=chs.slice().sort((a,b)=>a.i-b.i);
 const arr=clusters(text);let h='',pos=0;
 chs.forEach(ch=>{if(ch.i<pos)return;h+=esc(arr.slice(pos,ch.i).join(''));const seg=arr.slice(ch.i,ch.i+ch.n).join('')||' ';h+='<span class="cw">'+esc(seg)+'<b class="ch" dir="ltr"'+(ch.k!=null?' data-k="'+ch.k+'"':'')+'>'+esc(ch.c)+'</b></span>';pos=ch.i+ch.n});
 return h+esc(arr.slice(pos).join(''));
}
function songChords(s){const set=[];(s.parts||[]).forEach(p=>(p.chords||[]).forEach(c=>{if(!set.includes(c.c))set.push(c.c)}));return set}
function chordColor(s){return (s&&s.style&&s.style.chordColor)||DEF_CH_COL}
function trNote(n,k){const p=parseChord(n);if(!p)return n;return CH_ROOTS[((p.pc+k)%12+12)%12]}
function transposeChord(c,k){
 if(!k)return c;const m=String(c||'').trim().match(/^([A-Ga-g][#b♯♭]?)(.*?)(?:\/([A-Ga-g][#b♯♭]?))?$/);if(!m)return c;

}
function transposeSong(s,k){
 (s.parts||[]).forEach(p=>(p.chords||[]).forEach(ch=>ch.c=transposeChord(ch.c,k)));

}
function shownChord(s,c){return s&&s.capo?transposeChord(c,-s.capo):c}

function applyWebChords(s,pairs){

  lines.forEach((line,li)=>{

function parseNakdan(j){
 const arr=Array.isArray(j)?j:(j&&Array.isArray(j.data)?j.data:null);if(!arr)throw new Error('format');
 return arr.map(it=>{
  if(it&&it.nakdan){const o=it.nakdan.options||[];const pick=o.find(x=>x&&x.levelChoice===1)||o[0];const w=pick?(typeof pick==='string'?pick:pick.w):null;return String(w!=null?w:(it.nakdan.word!=null?it.nakdan.word:(it.str||''))).replace(/\|/g,'')}
  if(it&&it.sep)return it.word!=null?it.word:(it.str||'');
  if(it&&Array.isArray(it.options)&&it.options.length){const o=it.options[0];return String(typeof o==='string'?o:(o.w||o[0]||it.word||'')).replace(/\|/g,'')}
  return (it&&(it.word!=null?it.word:it.str))||'';
 }).join('');
}

function mergeNik(orig,vox){

function alignNik(orig,vox){

 });

}

const CHM=/([^]*)/g;
function chordMarked(lines){

 for(let i=0;i<lines.length;i++){
  const l=lines[i];
  if(l.chord){
   const nx=lines[i+1];
   if(nx&&!nx.chord&&!nx.gapBefore&&nx.txt.trim()){
    const toks=[];const re=/\S+/g;let m;while((m=re.exec(l.txt))){if(!isChord(m[0]))continue;const xa=l.xs[m.index],xb=l.xs[m.index+m[0].length-1];if(xa==null||xb==null)continue;toks.push({c:m[0],x:(Math.min(xa,xb)+Math.max(xa,xb))/2})}
    const cand=[];[...nx.txt].forEach((c,k)=>{if(c!==' '&&nx.xs[k]!=null)cand.push(k)});
    const at={};
    toks.forEach(t=>{let best=-1,bd=1e9;cand.forEach(k=>{const d=Math.abs(nx.xs[k]-t.x);if(d<bd){bd=d;best=k}});if(best<0)return;while(at[best]!=null&&best<nx.txt.length-1)best++;at[best]=t.c});

    out.push(t);i++;continue;
   }
   continue;
  }
  if(l.gapBefore)out.push('');
  out.push(l.txt);

}
function extractMarkers(parts){

async function hordeImage(p,onStat){
 const H={apikey:'0000000000','Client-Agent':'StagePromt:1.0:aviad'};
 const body=JSON.stringify({prompt:p+FREE_SUFFIX+' ### text, letters, watermark, logo, blurry, deformed',params:{width:640,height:384,steps:20,n:1,sampler_name:'k_euler_a',cfg_scale:7},nsfw:false,censor_nsfw:true,r2:true,trusted_workers:false,slow_workers:true});
 const r=await aiReq('POST','https://aihorde.net/api/v2/generate/async',body,H,false,30000);let jj;try{jj=JSON.parse(r.text)}catch(e){throw new Error('bad reply')}
 const id=jj.id;if(!id)throw new Error(jj.message||'no id');
 const t0=Date.now();
 while(Date.now()-t0<300000){
  await sleep(4000);
  let c;try{c=JSON.parse((await aiReq('GET','https://aihorde.net/api/v2/generate/check/'+id,'',H,false,20000)).text)}catch(e){continue}
  if(c.faulted)throw new Error('faulted');
  if(c.done)break;
  if(c.is_possible===false)throw new Error('no workers');
  if(onStat)onStat('AI Horde · '+(c.queue_position>0?'בתור: מקום '+c.queue_position+' · ':'מצייר · ')+'בערך '+Math.max(1,Math.round(c.wait_time||5))+' שנ׳');
 }
 const st=JSON.parse((await aiReq('GET','https://aihorde.net/api/v2/generate/status/'+id,'',H,false,30000)).text);
 const g=(st.generations||[])[0];if(!g||!g.img)throw new Error('no image');
 if(/^https?:/.test(g.img)){const d=await aiReq('GET',g.img,'',null,true,60000);if(isImg(d.text))return d.text;throw new Error('download')}
 return 'data:image/webp;base64,'+g.img;
}
async function freeImage(prompt,onStat){

 for(const eng of FREE_ENGINES){
  onStat&&onStat(eng.n+' · יוצר תמונה…');
  try{return await eng.run(en,onStat)}catch(e){if(/nonative/.test(e.message))throw e;errs.push(eng.n+': '+shortErr(e))}
 }
 const er=new Error('allfail');er.detail=errs.join(' | ');throw er;
}

async function geminiImage(prompt){

 const full=prompt+'\n\nCreate a wide landscape 16:9 background image for a stage lyrics screen. No text, no letters, no logos, no watermark. Leave calm space for big lyrics on top.';
 let last='';
 for(const m of GEM_MODELS){
  for(const cfg of [{responseModalities:['IMAGE','TEXT'],imageConfig:{aspectRatio:'16:9'}},{responseModalities:['IMAGE','TEXT']}]){
   const body=JSON.stringify({contents:[{parts:[{text:full}]}],generationConfig:cfg});
   let r;try{r=await aiPost('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(key),body)}catch(e){last=e.message;if(/timeout|timed out|nonative|Unable to resolve|UnknownHost/i.test(last))throw e;continue}
   let j;try{j=JSON.parse(r.text)}catch(e){last='bad';continue}
   if(j.error){last=(j.error.status||'')+' '+(j.error.message||'');if(/API_KEY|PERMISSION_DENIED|UNAUTHENTICATED|RESOURCE_EXHAUSTED|quota/i.test(last))throw new Error(last);if(j.error.code===404||/not found|not supported/i.test(last))break;continue}

  }
 }

}

function unwrapUrl(href,base){
 if(!href)return '';
 let u;try{u=new URL(href,base)}catch(e){return ''}
 const q=u.searchParams;
 if(q.get('uddg'))return decodeURIComponent(q.get('uddg'));

function makePdfFile(jpgs){

 const n=jpgs.length,PW=595.28,PH=841.89;
 push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
 const kids=[];for(let i=0;i<n;i++)kids.push((3+i*3)+' 0 R');
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,'<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>');
 jpgs.forEach((j,i)=>{const p=3+i*3,im=p+1,ct=p+2,cs='q '+PW+' 0 0 '+PH+' 0 0 cm /Im0 Do Q';
  obj(p,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+ct+' 0 R >>');
  obj(im,'<< /Type /XObject /Subtype /Image /Width '+PDFX.W+' /Height '+PDFX.H+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.byteLength+' >>',j);
  obj(ct,'<< /Length '+cs.length+' >>',enc.encode(cs))});
 const total=3+n*3,xo=len;let xr='xref\n0 '+total+'\n0000000000 65535 f \n';for(let i=1;i<total;i++)xr+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
 push(xr+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xo+'\n%%EOF');
 const out=new Uint8Array(len);let o=0;chunks.forEach(c=>{out.set(c,o);o+=c.length});return out.buffer;
}

async function buildSet(){
 const list=visibleSongs().filter(s=>s.parts.length||s.kind==='pdf');
 const name=S.ui.folder==='all'||S.ui.folder==='fav'?'סט '+new Date().toLocaleDateString('he-IL'):folderName(S.ui.folder);
 const songs=list.map(s=>({title:s.title,artist:s.artist||'',key:s.key||'',kind:s.kind,parts:s.parts,style:s.style,img:s.img||'',pdfId:s.pdfId||'',from:s.from,to:s.to,pdfName:s.pdfName||''}));
 const pdfs=await pdfPayload([...new Set(list.filter(s=>s.pdfId).map(s=>s.pdfId))]);
 return {type:'stagepromt-set',v:1,name,at:Date.now(),songs,pdfs};
}

/* ========= song library from the slide generator (Firebase) ========= */
const GENBG=(()=>{
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hx(h){h=h.replace("#","");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(a,b,t){const A=hx(a),B=hx(b);return"#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("")}
function rgba(h,a){const[r,g,b]=hx(h);return`rgba(${r},${g},${b},${a})`}

const TIMES={
 dawn:{sky:["#24305e","#b5627e","#f4b08a"],sun:"#ffe2b6",sunY:.6,land:"#3c3550",haze:"#f4b08a"},
 day:{sky:["#2f6fbf","#7fb6e6","#d8ecfb"],sun:"#fff7dc",sunY:.2,land:"#4f6b3a",haze:"#cfe4f3"},
 dusk:{sky:["#1c1838","#7b2d4e","#f08a4b"],sun:"#ffd06f",sunY:.64,land:"#2b1c2c",haze:"#f08a4b"},
 night:{sky:["#02050f","#0b1734","#1e3460"],sun:"#f3f0e2",sunY:.2,land:"#070d1a",haze:"#1e3460",moon:1},
 night2:{sky:["#05030f","#1f1238","#3d2463"],sun:"#efe7ff",sunY:.18,land:"#0a0716",haze:"#3d2463",moon:1},
 grey:{sky:["#2a3138","#4e5a63","#86939b"],sun:"#d9dfe3",sunY:.3,land:"#20272c",haze:"#86939b"},
 warm:{sky:["#2a0f1c","#6e1f38","#c85a4a"],sun:"#ffd9a0",sunY:.5,land:"#1b0a12",haze:"#c85a4a"},
 rose:{sky:["#1a0e24","#5b2350","#c76d93"],sun:"#ffe0ec",sunY:.5,land:"#12081a",haze:"#c76d93"}
};
function sky(c,W,H,t,hz){const g=c.createLinearGradient(0,0,0,H*hz);g.addColorStop(0,t.sky[0]);g.addColorStop(.6,t.sky[1]);g.addColorStop(1,t.sky[2]);c.fillStyle=g;c.fillRect(0,0,W,H)}
function glowDisc(c,x,y,r,col,glow=4){const g=c.createRadialGradient(x,y,r*.2,x,y,r*glow);g.addColorStop(0,rgba(col,.55));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(x-r*glow,y-r*glow,r*glow*2,r*glow*2);c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function starsF(c,W,H,n,R,maxY){for(let i=0;i<n;i++){const r=R()*1.6+.3;c.globalAlpha=.35+R()*.65;c.fillStyle="#fff";c.beginPath();c.arc(R()*W,R()*H*maxY,r*W/1920*1.4,0,7);c.fill()}c.globalAlpha=1}
function ridge(c,W,H,base,amp,col,R,fq=1){const p=[R()*6,R()*6,R()*6];c.fillStyle=col;c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=W/120){const u=x/W;c.lineTo(x,H*base-H*amp*(Math.sin(u*3*fq+p[0])*.5+Math.sin(u*7*fq+p[1])*.3+Math.sin(u*17*fq+p[2])*.12))}c.lineTo(W,H);c.closePath();c.fill()}
function layers(c,W,H,t,R,n,top,bottom,amp){for(let i=0;i<n;i++){const k=i/(n-1||1);ridge(c,W,H,top+(bottom-top)*k,amp*(1-k*.4),mix(t.haze,t.land,.35+k*.65),R,1+k)}}
function moonOrSun(c,W,H,t,R,x){const r=H*(t.moon?.05:.07);glowDisc(c,W*x,H*t.sunY,r,t.sun,t.moon?3:5)}
function tree(c,x,y,s,col){c.fillStyle=col;c.fillRect(x-s*.06,y-s*.6,s*.12,s*.6);c.beginPath();c.arc(x,y-s*.75,s*.35,0,7);c.arc(x-s*.25,y-s*.6,s*.25,0,7);c.arc(x+s*.25,y-s*.6,s*.25,0,7);c.fill()}
function cypress(c,x,y,s,col){c.fillStyle=col;c.beginPath();c.ellipse(x,y-s*.55,s*.12,s*.55,0,0,7);c.fill()}
function palm(c,x,y,s,col,R){c.strokeStyle=col;c.lineWidth=s*.05;c.beginPath();c.moveTo(x,y);const lean=(R()-.5)*s*.4;c.quadraticCurveTo(x+lean*.3,y-s*.5,x+lean,y-s);c.stroke();const tx=x+lean,ty=y-s;c.lineWidth=s*.025;for(let i=0;i<8;i++){const a=-Math.PI+i/7*Math.PI;c.beginPath();c.moveTo(tx,ty);c.quadraticCurveTo(tx+Math.cos(a)*s*.25,ty+Math.sin(a)*s*.25-s*.05,tx+Math.cos(a)*s*.45,ty+Math.sin(a)*s*.2+s*.12);c.stroke()}}

const PAINT={
 sea(c,W,H,t,R){sky(c,W,H,t,.55);if(t.moon)starsF(c,W,H,260,R,.5);moonOrSun(c,W,H,t,R,.3+R()*.4);

  if(b.length===1&&REF.test(b[0])&&!/[:：]/.test(b[0]))return{ref:true,lines:[]};
  const ch=/^(פזמון|פיזמון)\s*[:：]$/.test(b[0]);return{chorus:ch,lines:ch?b.slice(1):b}}).filter(b=>b.ref||b.lines.length)}

  if(m==='signin'||/HTTP 40[01]|INVALID_REFRESH|TOKEN_EXPIRED|USER_NOT_FOUND|UNAUTHENTICATED/.test(m)){localStorage.removeItem(FB.LS);$('#glMsg').innerHTML='ההתחברות פגה. <button class="btn sm" id="glRe">התחבר מחדש</button><br><small dir="ltr" style="opacity:.6">'+esc(det)+'</small>';$('#glRe').onclick=()=>{closeModal();genLibModal()}}
  else if(/HTTP 403|PERMISSION_DENIED/.test(m)){$('#glMsg').innerHTML='אין הרשאה לקרוא את המאגר.<br><small dir="ltr" style="opacity:.6">'+esc(det)+'</small>'}
  else $('#glMsg').innerHTML='לא הצלחתי לטעון את המאגר.<br><small dir="ltr" style="opacity:.6">'+esc(det)+'</small>'});
 $('#glGo').onclick=async()=>{
  const picks=[...document.querySelectorAll('#glList [data-gl]')].filter(c=>c.checked).map(c=>list[+c.dataset.gl]);if(!picks.length)return toast('לא נבחרו שירים');
  closeModal();toast('מוסיף '+picks.length+' שירים…');let added=0,upd=0;
  for(const x of picks){
   const parts=GENBG.parts(x.text);let s=S.songs.find(q=>q.srcId===x.id);
   if(!s){const fname=x.list||'מהמחולל';let f=S.folders.find(q=>q.name===fname);if(!f){f={id:uid(),name:fname};S.folders.push(f)}
    s=newSongObj({title:x.title||'שיר',artist:x.artist||'',folderId:f.id,kind:'text'});S.songs.push(s);added++}else upd++;
   s.title=x.title||s.title;s.artist=x.artist||'';s.parts=parts;s.srcId=x.id;s.srcUpd=x.updatedAt||Date.now();
   try{const d=GENBG.render(x.bg);const id='bg-'+uid();await IDB.put(id,d);BG[id]=d;const old=s.bg&&s.bg.type==='img'?s.bg.id:null;s.bg={type:'img',id,dim:(s.bg&&s.bg.dim!=null)?s.bg.dim:.45};if(old&&old!==id)dropBgImg(old)}catch(e){}
   touch(s);await sleep(0)}
  save(true);renderLib();toast((added?'נוספו '+added+' שירים':'')+(added&&upd?', ':'')+(upd?'עודכנו '+upd:''));
 };
}

/* ========= native bridge ========= */
let _pdfName='',_chunks=[];
window.__pdfBegin=function(name){_pdfName=name;_chunks=[];if(SCREEN!=='imp')openImp();IMP.busy=true;IMP.name=name;renderImp()};
window.__pdfChunk=function(c){_chunks.push(c)};
window.__pdfEnd=function(){
 try{const b=atob(_chunks.join(''));_chunks=[];const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);onPdf(_pdfName,u.buffer)}
 catch(e){IMP.busy=false;renderImp();toast('קריאת הקובץ נכשלה')}
};
window.__pdfError=function(m){IMP.busy=false;renderImp();toast(m)};
window.__pdfCancel=function(){};
window.appBack=function(){
 if(!$('#modalWrap').hidden){closeModal();return true}
 if(SCREEN==='play'){exitShow();return true}
 if(SCREEN==='edit'){closeEditor();return true}
 if(SCREEN==='imp'){closeImp();return true}
 if(SCREEN==='web'){closeWeb();return true}
 return false;
};

/* ========= init ========= */
$$('i[data-ic]').forEach(e=>{e.outerHTML=ic(e.dataset.ic,+e.dataset.s||20)});
$('#srcSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pickSource(b.dataset.src)});
if(LANG==='en'){i18nTree(document.body);new MutationObserver(ms=>{ms.forEach(m=>{if(m.type==='characterData')i18nTree(m.target);else m.addedNodes.forEach(n=>i18nTree(n))})}).observe(document.body,{childList:true,subtree:true,characterData:true})}
if(S.ui.bg){delete S.ui.bg;save();IDB.del('stage-bg')}
renderLib();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

/* ========= splash ========= */
(function(){
 const sp=$('#splash');if(!sp)return;
 let skip=false;try{skip=sessionStorage.getItem('skipSplash')==='1';sessionStorage.removeItem('skipSplash')}catch(e){}
 if(skip){sp.remove();return}
 const DUR=5000,bar=$('#spFillBar'),pct=$('#spPct'),t0=performance.now();
 function frame(now){
  const p=Math.min(1,(now-t0)/DUR),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
  bar.style.width=(e*100)+'%';pct.textContent=Math.round(p*100)+'%';
  if(p<1)requestAnimationFrame(frame);
  else setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),650)},300);
 }
 requestAnimationFrame(frame);
})();
</script>
