<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<title>התחברות ל-StagePromt</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Rubik:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0B0C0E;color:#F4EFE6;font-family:'Assistant',sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px}
.card{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.logo{font-family:'Rubik';font-size:30px;font-weight:700;letter-spacing:1px}.logo em{font-style:normal;color:#E8A23A}
h1{margin:0;font-size:22px;font-weight:700}
p{margin:0;color:#8F897F;font-size:16px;line-height:1.5}
button,.btn{width:100%;height:54px;border-radius:14px;border:1px solid #2C2F35;background:#17191D;color:#F4EFE6;font:700 17px 'Assistant',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;text-decoration:none}
.g{background:#fff;color:#1F1F1F;border-color:#fff}
.pri{background:#E8A23A;color:#1A1205;border-color:#E8A23A}
details{width:100%}summary{color:#8F897F;cursor:pointer;font-size:15px;padding:6px}
input{width:100%;height:50px;border-radius:12px;border:1px solid #2C2F35;background:#121418;color:#F4EFE6;font-size:16px;padding:0 14px;margin-top:10px;direction:ltr;text-align:left}
.err{color:#E0675C;font-size:14px;min-height:20px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="card">
 <div class="logo">STAGE<em>PROMT</em></div>
 <div id="login">
  <h1>התחברות לחשבון</h1>
  <p style="margin:8px 0 18px">החשבון שומר את השירים שלך ומסנכרן אותם בין המכשירים.</p>
  <button class="g" id="ggo"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>התחבר עם Google</button>
  <details style="margin-top:14px"><summary>או התחברות עם אימייל וסיסמה</summary>
   <input id="lem" type="email" placeholder="אימייל" autocomplete="username"><input id="lpw" type="password" placeholder="סיסמה" autocomplete="current-password">
   <button id="lgo" style="margin-top:12px">התחבר</button>
  </details>
  <div class="err" id="err" role="alert" style="margin-top:12px"></div>
 </div>
 <div id="done" hidden>
  <h1 id="dt">מחובר</h1>
  <p style="margin:8px 0 18px">חוזר לאפליקציה…</p>
  <a class="btn pri" id="back" href="#">חזור ל-StagePromt</a>
 </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const KEY='AIzaSyAQj76Gha9yGidawfxbouvrE47teuzIsO4';
const APP=(()=>{const v=new URLSearchParams(location.search).get('app');return /^stagepromtm?$/.test(v||'')?v:'stagepromt'})();
const RET=(()=>{const v=new URLSearchParams(location.search).get('ret')||'';return /^http:\/\/127\.0\.0\.1:\d{2,5}\/cb$/.test(v)?v:''})();
function back(st){
 const qs='r='+encodeURIComponent(st.refresh)+'&u='+encodeURIComponent(st.uid||'')+'&e='+encodeURIComponent(st.email||'');
 const url=RET?RET+'?'+qs:APP+'://fbauth?'+qs;
 $('#login').hidden=true;$('#done').hidden=false;$('#dt').textContent='מחובר'+(st.email?' בתור '+st.email:'');$('#back').href=url;
 setTimeout(()=>{location.href=url},300);
}
let fb=null;function sdk(){if(!window.firebase)return null;if(!fb)fb=firebase.initializeApp({apiKey:KEY,authDomain:'stagepromt.firebaseapp.com',projectId:'stagepromt'});return fb}
function useUser(u){back({uid:u.uid,email:u.email,refresh:u.refreshToken})}
$('#ggo').onclick=async()=>{const er=$('#err');const app=sdk();if(!app){er.textContent='רכיב ההתחברות של Google לא נטען. בדוק את החיבור לאינטרנט.';return}
 er.textContent='';const auth=app.auth();const prov=new firebase.auth.GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
 try{const r=await auth.signInWithPopup(prov);useUser(r.user)}catch(x){
  if(x.code==='auth/popup-blocked'||x.code==='auth/operation-not-supported-in-this-environment'){try{await auth.signInWithRedirect(prov)}catch(y){er.textContent='ההתחברות נכשלה: '+(y.code||y.message)}return}
  if(x.code==='auth/popup-closed-by-user'||x.code==='auth/cancelled-popup-request')return;
  er.textContent='ההתחברות נכשלה: '+(x.code||x.message)}};
$('#lgo').onclick=async()=>{const e=$('#lem').value.trim(),p=$('#lpw').value,er=$('#err');if(!e||!p){er.textContent='מלא אימייל וסיסמה.';return}
 er.textContent='מתחבר…';
 try{const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p,returnSecureToken:true})});
  const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'HTTP '+r.status);er.textContent='';back({uid:j.localId,email:j.email,refresh:j.refreshToken})}
 catch(x){er.textContent=/INVALID|PASSWORD|EMAIL|USER/.test(x.message)?'האימייל או הסיסמה שגויים.':'ההתחברות נכשלה. בדוק את החיבור לאינטרנט.'}};
(async()=>{const app=sdk();if(!app)return;try{const r=await app.auth().getRedirectResult();if(r&&r.user)useUser(r.user)}catch(e){}})();
</script>
</body>
</html>
